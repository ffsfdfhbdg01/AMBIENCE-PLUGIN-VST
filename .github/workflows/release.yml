name: Installers

# Builds signed (when secrets are configured) installers for Windows (.exe) and macOS (.pkg).
# - push a tag "v1.2.3"  -> installers + GitHub Release
# - "Run workflow" button or changes to the installer -> installers as workflow artefacts only
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["installer/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=$(sed -n 's/^project(Ambience VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAMBIENCE_BUILD_TESTS=OFF -DAMBIENCE_VERSION="$VERSION"
          cmake --build build --config Release --parallel --target Ambience_VST3 Ambience_Standalone

      # --- Code signing, option A: certificate file (OV/EV .pfx) --------------------------
      - name: Sign binaries (PFX certificate)
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          echo "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          $files = @("build\Ambience_artefacts\Release\VST3\Ambience.vst3\Contents\x86_64-win\Ambience.vst3",
                     "build\Ambience_artefacts\Release\Standalone\Ambience.exe")
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Ambience" $files
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # --- Code signing, option B: Azure Trusted Signing (Artifact Signing) -----------------
      - name: Sign binaries (Azure Trusted Signing)
        if: env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: build\Ambience_artefacts\Release
          files-folder-filter: vst3,exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$env:GITHUB_WORKSPACE\build\Ambience_artefacts\Release" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" installer\windows\Ambience.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Sign installer (PFX certificate)
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Ambience Installer" (Get-ChildItem dist\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - name: Sign installer (Azure Trusted Signing)
        if: env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Unsigned build notice
        if: env.HAS_PFX != 'true' && env.HAS_AZURE != 'true'
        shell: bash
        run: echo "::warning::Windows installer is NOT code-signed - SmartScreen will show 'Windows protected your PC'. See README (Instalatory)."

      - uses: actions/upload-artifact@v4
        with:
          name: Ambience-Windows-Installer
          path: dist/*.exe

  macos:
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin (Universal Binary)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAMBIENCE_BUILD_TESTS=OFF -DAMBIENCE_VERSION="$VERSION" \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release --parallel --target Ambience_VST3 Ambience_AU Ambience_Standalone

      # Imports "Developer ID Application" + "Developer ID Installer" certificates (one .p12).
      - name: Import signing certificates
        if: env.HAS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build installer (.pkg)
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: installer/macos/build_pkg.sh "$VERSION" build/Ambience_artefacts/Release dist

      - uses: actions/upload-artifact@v4
        with:
          name: Ambience-macOS-Installer
          path: dist/*.pkg

  release:
    needs: [version, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -e "s|@VERSION@|$VERSION|g" -e "s|@TAG@|$GITHUB_REF_NAME|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
              installer/RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Ambience ${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/*.exe
            dist/*.pkg
          fail_on_unmatched_files: true
          make_latest: true
