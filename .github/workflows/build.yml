name: Build & validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: DSP tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tests -DAMBIENCE_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-tests --parallel
      - name: Acceptance tests
        run: ./build-tests/ambience_tests

  plugin:
    name: Plugin (${{ matrix.name }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
            targets: Ambience_VST3
          - name: Windows
            os: windows-latest
            pluginval: pluginval_Windows.zip
            targets: Ambience_VST3
          - name: macOS
            os: macos-14
            pluginval: pluginval_macOS.zip
            targets: Ambience_VST3 Ambience_AU
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          TESTS=OFF
          if [ "$RUNNER_OS" == "macOS" ]; then EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'; fi
          if [ "$RUNNER_OS" == "Linux" ]; then TESTS=ON; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAMBIENCE_BUILD_TESTS=$TESTS "$EXTRA"

      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do cmake --build build --config Release --parallel --target $t; done

      - name: Host tests (layouts 1.0 ... 7.1.4, routing, bypass, state)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --parallel --target ambience_host_tests
          xvfb-run -a ./build/ambience_host_tests_artefacts/Release/ambience_host_tests

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q pluginval.zip
          VST3="build/Ambience_artefacts/Release/VST3/SAMS AMBIENCE CONTROL.vst3"
          case "$RUNNER_OS" in
            Linux)   xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
            macOS)   ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
            Windows) ./pluginval.exe --strictness-level 10 --validate-in-process "$VST3" ;;
          esac

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: SAMS-Ambience-Control-${{ matrix.name }}
          path: |
            build/Ambience_artefacts/Release/VST3
            build/Ambience_artefacts/Release/AU
          if-no-files-found: warn
